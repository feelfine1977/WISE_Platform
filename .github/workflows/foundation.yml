name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11", "3.12", "3.13.16", "3.14"]
        node: ["22.19.0", "24.19.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install the pinned development environment
        run: python -m pip install -r requirements-dev.lock
      - name: Install the local application
        run: python -m pip install -e . --no-deps
      - name: Install browser build dependencies
        run: npm ci
      - name: Generate contract models and types
        run: npm run generate
      - name: Verify reproducible contract generation
        run: git diff --exit-code -- apps/api/src/wise_platform_api/generated/health.py apps/web/src/generated/health.ts
      - name: Check browser and contract types
        run: npm run check
      - name: Build the local browser assets
        run: npm run build
      - name: Test contracts, host startup and restart
        run: npm test
