[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wise-platform"
version = "0.1.0"
description = "A local visual process investigation workspace"
requires-python = ">=3.11,<3.15"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = [
  "datamodel-code-generator==0.83.0",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pytest>=8,<10",
  "rfc3339-validator>=0.1.4,<1"
]

[tool.setuptools.packages.find]
where = ["apps/api/src", "packages/analytics/src"]

[tool.setuptools.package-data]
wise_platform_api = ["static/*", "static/**/*", "examples/*.csv", "examples/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/analytics/tests", "apps/api/tests"]
addopts = "-ra"
